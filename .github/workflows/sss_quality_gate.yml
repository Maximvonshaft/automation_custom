name: SSS Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate implementation pack
        run: python 15_automation_scripts/validate_pack.py
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Security scan
        run: bandit -q -r agent control_plane shared
