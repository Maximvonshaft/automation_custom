name: Production Task
description: Production-grade engineering task
title: "[Production]: "
labels: ["production-task"]
body:
  - type: textarea
    id: business_objective
    attributes:
      label: Business Objective
      description: What business outcome should this task achieve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Non-scope
      description: What is included and excluded?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Code paths, screenshots, logs, or user evidence.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Given / When / Then criteria.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk Level
      options:
        - R1
        - R2
        - R3
        - R4
        - R5
    validations:
      required: true
