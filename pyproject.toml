[project]
name = "customsops-autopilot"
version = "4.0.0"
description = "Controlled runtime MVP for CustomsOps Autopilot v4."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.110.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "uvicorn>=0.27.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "bandit>=1.7.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agent*", "control_plane*", "shared*"]
